<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediaHub — фотографы, видеографы, актёры и модели</title>
<meta name="description" content="MediaHub — бесплатная платформа для поиска фотографов, видеографов, мобилографов, актёров и моделей.">
<meta property="og:title" content="MediaHub">
<meta property="og:description" content="Найдите медиа-специалиста или разместите заказ бесплатно.">
<meta property="og:type" content="website">
<meta property="og:image" content="">
<style>
/* ===== Дизайн-система MediaHub ===== */
:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --surface-2: #f2f1ef;
  --text: #1c1b1a;
  --muted: #6b6864;
  --line: #e4e2de;
  --accent: #d9480f;
  --accent-ink: #ffffff;
  --accent-soft: #fff0e8;
  --ok: #2b8a3e;
  --ok-soft: #e6f4ea;
  --warn: #8a5a00;
  --warn-soft: #fff6dd;
  --danger: #c92a2a;
  --star: #f59f00;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.06);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #1b1b1b; --surface-2: #252525; --text: #f1efec; --muted: #a29e98;
    --line: #313131; --accent: #ff7a3d; --accent-ink: #1a0d06; --accent-soft: #3a2014;
    --ok: #69db7c; --ok-soft: #1c3322; --warn: #ffd43b; --warn-soft: #3a3115; --danger: #ff6b6b;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1b1b1b; --surface-2: #252525; --text: #f1efec; --muted: #a29e98;
  --line: #313131; --accent: #ff7a3d; --accent-ink: #1a0d06; --accent-soft: #3a2014;
  --ok: #69db7c; --ok-soft: #1c3322; --warn: #ffd43b; --warn-soft: #3a3115; --danger: #ff6b6b;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; outline: none; }
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .6em; letter-spacing: -.01em; }
h1 { font-size: clamp(26px, 5vw, 44px); }
h2 { font-size: clamp(20px, 3vw, 26px); }
h3 { font-size: 17px; }
p { margin: 0 0 1em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.sec { padding: 36px 16px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.sec-head h2 { margin: 0; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 12px; top: 12px; z-index: 99; background: var(--surface); padding: 8px 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Кнопки и поля */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); padding: 10px 18px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn-ghost:hover { background: var(--surface-2); filter: none; }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--line); }
.btn-sm { padding: 6px 13px; font-size: 14px; }
.btn-block { width: 100%; }
.link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.link-btn:hover { color: var(--text); }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.field { margin-bottom: 14px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 400; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=url], input[type=date], input[type=search], select, textarea {
  width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 11px;
}
textarea { min-height: 110px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.check { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 14px; cursor: pointer; margin-bottom: 6px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.row { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .row-2 { grid-template-columns: 1fr 1fr; } .row-3 { grid-template-columns: 1fr 1fr 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; }
.chip-check { position: relative; }
.chip-check input { position: absolute; opacity: 0; }
.chip-check span { display: inline-block; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; font-weight: 500; cursor: pointer; }
.chip-check input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip-check input:focus-visible + span { outline: 2px solid var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.panel + .panel { margin-top: 16px; }
.notice { padding: 10px 14px; border-radius: var(--radius-sm); background: var(--warn-soft); color: var(--text); font-size: 14px; border-left: 3px solid var(--warn); margin-bottom: 16px; }
.notice-ok { background: var(--ok-soft); border-left-color: var(--ok); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-accent { background: var(--accent-soft); color: var(--accent); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-danger { background: transparent; color: var(--danger); border: 1px solid currentColor; }
.verified { color: var(--accent); font-size: 14px; }
.stars { color: var(--star); letter-spacing: 1px; }
.badge { position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; }

/* Хедер */
.hdr { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hdr-in { display: flex; align-items: center; gap: 16px; height: 62px; }
.logo { font-size: 21px; font-weight: 500; text-decoration: none; letter-spacing: -.02em; }
.logo b { color: var(--accent); font-weight: 800; }
.nav { display: none; gap: 20px; align-items: center; margin-left: 12px; }
.nav a:not(.btn) { text-decoration: none; color: var(--muted); font-weight: 500; }
.nav a:not(.btn):hover, .nav a.active { color: var(--text); }
.hdr-act { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 0; background: transparent; color: var(--text); font-size: 17px; cursor: pointer; text-decoration: none; }
.icon-btn:hover { background: var(--surface-2); }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; border-radius: 50%; }
.menu summary::-webkit-details-marker { display: none; }
.menu-pop { position: absolute; right: 0; top: 46px; width: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; z-index: 30; }
.menu-pop a, .menu-pop button { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; text-decoration: none; background: none; border: 0; font: inherit; color: var(--text); cursor: pointer; }
.menu-pop a:hover, .menu-pop button:hover { background: var(--surface-2); }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.menu-who { padding: 8px 10px; }
.burger { display: grid; }
.nav.open { display: flex; position: absolute; top: 62px; left: 0; right: 0; flex-direction: column; align-items: stretch; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px 16px; margin: 0; gap: 4px; }
.nav.open a { padding: 10px 0; }
@media (min-width: 860px) { .nav, .nav.open { display: flex; position: static; flex-direction: row; padding: 0; border: 0; background: none; margin-left: 12px; } .nav.open a { padding: 0; } .burger { display: none; } }

/* Аватар */
.ava { border-radius: 50%; object-fit: cover; flex: none; display: inline-grid; place-items: center; color: #fff; font-weight: 700; background: var(--muted); overflow: hidden; }

/* Главная */
.hero { padding: 56px 0 40px; background: radial-gradient(circle at 85% -10%, var(--accent-soft), transparent 55%); }
.hero h1 span { color: var(--accent); }
.lead { font-size: 17px; color: var(--muted); max-width: 620px; }
.search { display: grid; grid-template-columns: 1fr; gap: 8px; background: var(--surface); padding: 8px; border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--shadow); max-width: 720px; margin-top: 24px; }
.search select, .search input { border: 0; background: var(--surface-2); }
@media (min-width: 640px) { .search { grid-template-columns: 1.2fr 1fr 1fr auto; border-radius: 999px; } .search select, .search input { border-radius: 999px; } }
.cats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 640px) { .cats { grid-template-columns: repeat(5, 1fr); } }
.cat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 14px; text-decoration: none; display: flex; flex-direction: column; gap: 2px; transition: transform .15s, box-shadow .15s; }
.cat:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.cat-ic { font-size: 28px; margin-bottom: 6px; }
.cat small { color: var(--muted); }
.steps { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .steps { grid-template-columns: 1fr 1fr; } }
.steps ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 12px; margin-bottom: 14px; }
.steps li::before { content: counter(s); flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; }
.cta { background: var(--text); color: var(--bg); border-radius: 22px; padding: 36px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
.cta h2 { margin: 0 0 4px; }
.cta p { margin: 0; opacity: .7; }

/* Карточки специалистов */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.card { position: relative; background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); display: flex; flex-direction: column; }
.card-cover { position: relative; aspect-ratio: 4 / 5; background: var(--surface-2); display: block; overflow: hidden; }
.card-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
.card:hover .card-cover img { transform: scale(1.03); }
.card-cover .pill { position: absolute; left: 10px; top: 10px; }
.no-cover { width: 100%; height: 100%; display: grid; place-items: center; font-size: 42px; color: var(--muted); background: linear-gradient(135deg, var(--surface-2), var(--line)); }
.fav { position: absolute; right: 10px; top: 10px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.35); color: #fff; font-size: 16px; cursor: pointer; z-index: 2; }
.fav.on { background: var(--accent); color: #fff; }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.card-name { font-weight: 700; text-decoration: none; }
.card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; font-size: 14px; gap: 8px; }

/* Каталог */
.layout { display: grid; gap: 20px; grid-template-columns: 1fr; padding-top: 24px; padding-bottom: 40px; }
@media (min-width: 900px) { .layout { grid-template-columns: 270px 1fr; } }
.filters summary { font-weight: 700; cursor: pointer; padding: 4px 0; }
@media (min-width: 900px) { .filters summary { display: none; } .filters > div { display: block !important; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.toolbar select { width: auto; }

/* Заказы */
.order { display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; transition: border-color .15s; }
.order:hover { border-color: var(--accent); }
.order + .order { margin-top: 10px; }
.order h3 { margin: 4px 0 6px; }
.order-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); }
.order-budget { font-weight: 700; color: var(--text); }
.refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.refs img { aspect-ratio: 1; object-fit: cover; border-radius: 10px; cursor: zoom-in; }
.resp { border-top: 1px solid var(--line); padding: 14px 0; display: flex; gap: 12px; }
.resp:first-of-type { border-top: 0; }
.resp-body { flex: 1; min-width: 0; }
.status-flow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 13px; }
.status-flow .pill.on { background: var(--accent); color: var(--accent-ink); }

/* Профиль */
.prof-head { display: grid; gap: 20px; grid-template-columns: 1fr; padding: 28px 0 8px; }
@media (min-width: 900px) { .prof-head { grid-template-columns: 1fr 340px; } }
.prof-id { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
.prof-id h1 { font-size: clamp(24px, 4vw, 34px); margin: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.lock { text-align: center; padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius-sm); color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 20px 0 16px; scrollbar-width: none; }
.tabs a, .tabs button { padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 600; border: 0; background: none; font: inherit; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs .on { color: var(--text); border-bottom-color: var(--accent); }
.masonry { columns: 2 160px; column-gap: 10px; }
@media (min-width: 760px) { .masonry { columns: 3 220px; } }
.masonry figure { margin: 0 0 10px; break-inside: avoid; position: relative; border-radius: 10px; overflow: hidden; background: var(--surface-2); cursor: zoom-in; }
.masonry figure img { width: 100%; }
.masonry .vid { aspect-ratio: 16/9; display: grid; place-items: center; background: #000 center/cover; color: #fff; font-size: 40px; }
.masonry figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; font-size: 13px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
.review { padding: 14px 0; border-top: 1px solid var(--line); }
.review:first-child { border-top: 0; }
.reply { margin: 10px 0 0 16px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius-sm); font-size: 14px; }

/* Сообщения */
.chat { display: grid; grid-template-columns: 1fr; height: calc(100vh - 62px - 40px); min-height: 480px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); margin: 20px 0; }
@media (min-width: 800px) { .chat { grid-template-columns: 300px 1fr; } }
.convs { border-right: 1px solid var(--line); overflow-y: auto; }
.conv { display: flex; gap: 10px; align-items: center; padding: 12px 14px; text-decoration: none; border-bottom: 1px solid var(--line); }
.conv.on { background: var(--surface-2); }
.conv-txt { min-width: 0; flex: 1; }
.conv-txt div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--muted); }
.thread { display: flex; flex-direction: column; min-height: 0; }
.thread-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 16px; background: var(--surface-2); align-self: flex-start; word-wrap: break-word; position: relative; }
.msg.mine { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.msg time { display: block; font-size: 11px; opacity: .65; margin-top: 2px; }
.msg img { border-radius: 10px; margin: 4px 0; max-height: 240px; cursor: zoom-in; }
.msg .flag { position: absolute; right: -24px; top: 6px; background: none; border: 0; color: var(--muted); cursor: pointer; opacity: 0; }
.msg:hover .flag, .msg .flag:focus { opacity: 1; }
.composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { min-height: 42px; height: 42px; }
.file-btn { flex: none; }
@media (max-width: 799px) { .chat.has-thread .convs { display: none; } .chat:not(.has-thread) .thread { display: none; } }

/* Таблицы (админка) */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.stat-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.stat b { display: block; font-size: 28px; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 70px; }
.bars span { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }

/* Авторизация */
.auth { max-width: 420px; margin: 40px auto; }
.oauth { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.or { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 14px; }
.roles { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .roles { grid-template-columns: 1fr 1fr; } }
.role-card { text-align: left; padding: 22px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: inherit; color: var(--text); }
.role-card:hover { border-color: var(--accent); }
.role-card b { display: block; font-size: 18px; margin: 8px 0 4px; }

/* Футер */
.ftr { border-top: 1px solid var(--line); margin-top: 40px; padding: 28px 0; font-size: 14px; color: var(--muted); }
.ftr-in { display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: space-between; }
.ftr a { color: var(--muted); }
.ftr nav { display: flex; flex-wrap: wrap; gap: 8px 18px; }

/* Тосты, модалки */
#toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); }
.toast { background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 12px; box-shadow: var(--shadow); font-size: 14px; animation: up .2s ease-out; }
.toast.err { background: var(--danger); color: #fff; }
@keyframes up { from { transform: translateY(10px); opacity: 0; } }
.overlay { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: var(--radius); padding: 22px; width: min(100%, 480px); max-height: 90vh; overflow-y: auto; }
.lightbox img, .lightbox iframe { max-width: 94vw; max-height: 86vh; border-radius: 10px; border: 0; }
.lightbox iframe { width: min(94vw, 960px); aspect-ratio: 16/9; height: auto; }
.lb-close { position: fixed; top: 14px; right: 18px; color: #fff; background: none; border: 0; font-size: 32px; cursor: pointer; }

.prose { max-width: 760px; }
.prose h2 { margin-top: 1.4em; }
.mt { margin-top: 16px; }
.flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.right { margin-left: auto; }
.pager { text-align: center; margin-top: 20px; }
</style>
<script>
  try { var t = localStorage.getItem('mediahub_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>

<script>
'use strict';
/* MediaHub — MVP маркетплейса медиа-специалистов.
   Клиентское SPA: данные хранятся в localStorage (см. README). */

const DB_KEY = 'mediahub_db_kz1';
const SES_KEY = 'mediahub_session';
const THEME_KEY = 'mediahub_theme';
const DAY = 864e5;
const PAGE_SIZE = 12;
const NOTIF_TYPES = { response: 'Новый отклик на заказ', message: 'Новое сообщение', invite: 'Приглашение к заказу', review: 'Новый отзыв' };
const STATUS = { draft: 'Черновик', open: 'Открыт', selected: 'Исполнитель выбран', done: 'Завершён', cancelled: 'Отменён' };
const SAFETY = 'Платформа не участвует в расчётах. Не вносите предоплату без договора.';

/* ---------- утилиты ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();
const money =n => Number(n || 0).toLocaleString('ru-RU') + ' ₸';
const fmtDate = t => t ? new Date(t).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtTime = t => new Date(t).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const ago = t => { const d = (now() - t) / 1000; if (d < 60) return 'только что'; if (d < 3600) return Math.floor(d / 60) + ' мин назад'; if (d < 86400) return Math.floor(d / 3600) + ' ч назад'; return fmtDate(t); };
const safeUrl = u => /^(https?:\/\/|data:image\/|data:application\/|data:text\/)/i.test(u || '') ? u : '#';
const isoDate = t => t ? new Date(t).toISOString().slice(0, 10) : '';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); return true; } catch (e) { return false; } };

function hashPass(email, pass) {
  const s = email.toLowerCase() + ':' + pass;
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

/* ---------- данные ---------- */
let db;
function load() {
  try { const raw = lsGet(DB_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  const s = seed(); lsSet(DB_KEY, JSON.stringify(s)); return s;
}
function save() {
  if (!lsSet(DB_KEY, JSON.stringify(db))) toast('Хранилище браузера переполнено — удалите часть файлов', true);
}

const userById = id => db.users.find(u => u.id === id);
const profOf = id => db.profiles.find(p => p.userId === id);
const profByName = n => db.profiles.find(p => p.username.toLowerCase() === String(n).toLowerCase());
const catById = id => db.categories.find(c => c.id === id);
const cityName = id => id === 'online' ? 'Онлайн' : (db.cities.find(c => c.id === id)?.name || '—');
const orderById = id => db.orders.find(o => o.id === id);
const visibleProfiles = () => db.profiles.filter(p => { const u = userById(p.userId); return u && !u.isBlocked; });
const portfolioOf = id => db.portfolio.filter(x => x.userId === id).sort((a, b) => a.sort - b.sort);

function me() {
  const u = userById(lsGet(SES_KEY));
  return u && !u.isBlocked ? u : null;
}
const isSpecMode = u => u && u.role === 'specialist';

function fmtPrice(p) {
  if (p.priceType === 'deal' || !p.priceFrom) return 'Договорная';
  return 'от ' + money(p.priceFrom) + (p.priceType === 'hour' ? ' / час' : ' / проект');
}
function fmtBudget(o) {
  if (o.budgetType === 'fixed') return money(o.budgetMin);
  if (o.budgetType === 'range') return money(o.budgetMin).replace(' ₸', '') + ' – ' + money(o.budgetMax);
  return 'Договорной';
}
function videoInfo(url) {
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
  if (m) return { embed: 'https://www.youtube.com/embed/' + m[1], thumb: 'https://img.youtube.com/vi/' + m[1] + '/hqdefault.jpg' };
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { embed: 'https://player.vimeo.com/video/' + m[1], thumb: '' };
  if (/(vk\.com\/video|vkvideo\.ru)/.test(url)) return { embed: '', thumb: '' };
  return null;
}
function coverOf(p) {
  const items = portfolioOf(p.userId);
  const ph = items.find(i => i.type === 'photo');
  if (ph) return ph.url;
  const v = items.find(i => i.type === 'video' && videoInfo(i.url)?.thumb);
  return v ? videoInfo(v.url).thumb : '';
}
function recalcRating(specId) {
  const p = profOf(specId); if (!p) return;
  const rs = db.reviews.filter(r => r.specId === specId);
  p.reviewsCount = rs.length;
  p.rating = rs.length ? Math.round(rs.reduce((s, r) => s + r.rating, 0) / rs.length * 10) / 10 : 0;
}
function notify(userId, type, text, link) {
  const u = userById(userId); if (!u) return;
  const pref = (u.notif || {})[type] || { app: true, email: true };
  if (pref.app !== false) db.notifications.push({ id: uid(), userId, type, text, link, readAt: null, createdAt: now() });
  // Отправка email требует серверной части; здесь фиксируем только факт.
}
const isFav = specId => { const u = me(); return !!u && db.favorites.some(f => f.userId === u.id && f.specId === specId); };
const unreadMsgs = userId => db.messages.filter(m => !m.readAt && m.from !== userId && db.conversations.find(c => c.id === m.convId)?.members.includes(userId)).length;

      fields: [{ key: 'editing', label: 'Монтаж', type: 'bool' }, { key: 'color', label: 'Цветокоррекция', type: 'bool' }, { key: 'drone', label: 'Дрон', type: 'bool' }] },

    ['Ерлан Беков', 'erlan_photo', 'photo', 'c3', 'hour', 12000, ['Свадьба', 'Репортаж'], { studio: false, gear: 'Canon R6' }, true, 'Репортажная свадебная съёмка. Живые эмоции без постановки.'],

    const em = email || username + '@demo.kz';

    profiles.push({ userId: id, username, mainCat: cat, extraCats: [], genres, bio, priceType, priceFrom, available, travels: i % 2 === 0,
      contacts: { telegram: '@' + username, whatsapp: '', phone: '+7 701 000-' + String(10 + i).padStart(2, '0') + '-00', instagram: username, site: '' },

    for (let k = 0; k < 6; k++) {
      portfolio.push({ id: 'pf-' + username + k, userId: id, album: k < 4 ? 'Избранное' : 'Разное', type: 'photo', url: `https://picsum.photos/seed/${username}${k}/600/${heights[(k + i) % 6]}`, title: '', sort: k });

    refs: [], links: [], deadline: isoDate(t + 7 * DAY), status: 'open', selectedId: null, invited: [], createdAt: t - daysAgo * DAY, ...extra
  });
  const orders = [

  revs.forEach(([un, rating, text], i) => {

/* ---------- UI-хелперы ---------- */
function toast(text, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : ''); el.textContent = text;
  $('#toasts').append(el); setTimeout(() => el.remove(), 3200);
}
function avatar(u, size = 40) {
  if (u?.avatar) return `<img class="ava" src="${esc(safeUrl(u.avatar))}" alt="" width="${size}" height="${size}" style="width:${size}px;height:${size}px">`;
  const name = u?.name || '?';
  const initials = name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const hue = [...name].reduce((s, c) => s + c.charCodeAt(0), 0) % 360;
  return `<span class="ava" aria-hidden="true" style="width:${size}px;height:${size}px;font-size:${size * .38}px;background:hsl(${hue} 45% 48%)">${esc(initials)}</span>`;
}
const stars = r => `<span class="stars" aria-label="Рейтинг ${r} из 5">${'★'.repeat(Math.round(r))}${'☆'.repeat(5 - Math.round(r))}</span>`;
const ratingSmall = p => p.reviewsCount ? `<span><span class="stars">★</span> ${p.rating.toFixed(1)} <span class="muted">(${p.reviewsCount})</span></span>` : '<span class="muted small">Нет отзывов</span>';
const verifiedMark = u => u.isVerified ? '<span class="verified" title="Проверенный профиль" aria-label="Проверенный профиль">✔</span>' : '';
const badge = n => n ? `<span class="badge">${n > 99 ? '99+' : n}</span>` : '';
const options = (list, sel, empty) => (empty != null ? `<option value="">${esc(empty)}</option>` : '') + list.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(l)}</option>`).join('');
const catOptions = (sel, empty) => options(db.categories.map(c => [c.id, c.name]), sel, empty);
const cityOptions = (sel, empty, online) => options([...db.cities.map(c => [c.id, c.name]), ...(online ? [['online', 'Онлайн']] : [])], sel, empty);
const statusPill = s => `<span class="pill ${s === 'open' ? 'pill-ok' : s === 'selected' ? 'pill-accent' : s === 'cancelled' ? 'pill-danger' : ''}">${STATUS[s]}</span>`;
function setMeta(title, desc, image) {
  document.title = title ? title + ' — MediaHub' : 'MediaHub — фотографы, видеографы, актёры и модели';

function readImage(file, max = 1400, q = 0.82) {
  return new Promise((res, rej) => {
    if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return rej(new Error('Допустимы только изображения JPEG, PNG, WebP, GIF'));
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q)); }; img.onerror = () => rej(new Error('Не удалось прочитать изображение')); img.src = fr.result; };
    fr.onerror = () => rej(new Error('Ошибка чтения файла')); fr.readAsDataURL(file);
  });
}
function readFile(file, limitMb) {
  return new Promise((res, rej) => {
    if (file.size > limitMb * 1048576) return rej(new Error(`Файл больше ${limitMb} МБ`));
    const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('Ошибка чтения файла')); fr.readAsDataURL(file);
  });
}

function pageAdmin(q) {
  setMeta('Админ-панель');
  const u = me(); if (!u) return needLogin(); if (!u.isAdmin) return `<div class="wrap empty"><h2>Нет доступа</h2></div>`;
  const tab = q.tab || 'stats';
  let body = '';
  if (tab === 'stats') {
    const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() - (13 - i) * DAY; });
    const series = (arr, key = 'createdAt') => days.map(d => arr.filter(x => (x[key] || 0) >= d && x[key] < d + DAY).length);
    const blocks = [['Регистрации', db.users], ['Заказы', db.orders], ['Отклики', db.responses], ['Диалоги', db.conversations.map(c => ({ createdAt: c.createdAt || c.lastAt }))]];
    const filled = db.profiles.filter(p => portfolioOf(p.userId).length >= 3).length;
    body = `<div class="stat-grid">
      <div class="stat"><span class="muted small">Пользователи</span><b>${db.users.length}</b></div>
      <div class="stat"><span class="muted small">Исполнители (≥3 работ)</span><b>${filled}</b></div>
      <div class="stat"><span class="muted small">Открытые заказы</span><b>${db.orders.filter(o => o.status === 'open').length}</b></div>
      <div class="stat"><span class="muted small">Отклики</span><b>${db.responses.length}</b></div>
      <div class="stat"><span class="muted small">Диалоги</span><b>${db.conversations.length}</b></div>

      <div class="stat-grid">${blocks.map(([l, arr]) => { const s = series(arr), mx = Math.max(1, ...s);
        return `<div class="stat"><span class="muted small">${l} за 14 дней · ${s.reduce((a, b) => a + b, 0)}</span><div class="bars mt">${s.map((v, i) => `<span style="height:${v / mx * 100}%" title="${fmtDate(days[i])}: ${v}"></span>`).join('')}</div></div>`; }).join('')}</div>`;

      <div class="panel table-wrap"><table><thead><tr><th>Пользователь</th><th>Роль</th><th>Создан</th><th>Статус</th><th></th></tr></thead><tbody>
      ${list.map(x => `<tr><td><b>${esc(x.name)}</b> ${verifiedMark(x)}<div class="muted small">${esc(x.email)}</div>${profOf(x.id) ? `<a class="small" href="#/u/${esc(profOf(x.id).username)}">профиль</a>` : ''}</td>
        <td>${x.isAdmin ? 'Админ' : profOf(x.id) ? 'Исполнитель' : 'Заказчик'}</td><td class="small">${fmtDate(x.createdAt)}</td>
        <td>${x.isBlocked ? '<span class="pill pill-danger">Заблокирован</span>' : '<span class="pill pill-ok">Активен</span>'}</td>
        <td><div class="flex">${x.isAdmin ? '' : `<button class="btn btn-ghost btn-sm" data-action="adminVerify" data-id="${x.id}">${x.isVerified ? 'Снять ✔' : 'Выдать ✔'}</button>
          <button class="btn btn-danger btn-sm" data-action="adminBlock" data-id="${x.id}">${x.isBlocked ? 'Разблокировать' : 'Заблокировать'}</button>`}</div></td></tr>`).join('')}</tbody></table></div>`;
  } else if (tab === 'orders') {
    body = `<div class="panel table-wrap"><table><thead><tr><th>Заказ</th><th>Заказчик</th><th>Статус</th><th></th></tr></thead><tbody>
      ${db.orders.slice().sort((a, b) => b.createdAt - a.createdAt).map(o => `<tr><td><a href="#/orders/${o.id}">${esc(o.title)}</a><div class="muted small">${fmtDate(o.createdAt)}</div></td><td>${esc(userById(o.clientId)?.name)}</td><td>${statusPill(o.status)}</td>
        <td><button class="btn btn-danger btn-sm" data-action="adminDelete" data-type="order" data-id="${o.id}">Удалить</button></td></tr>`).join('')}</tbody></table></div>`;
  } else if (tab === 'reviews') {
    body = `<div class="panel table-wrap"><table><thead><tr><th>Отзыв</th><th>Исполнитель</th><th></th></tr></thead><tbody>
      ${db.reviews.map(r => `<tr><td>${stars(r.rating)}<div>${esc(r.text)}</div><div class="muted small">${esc(userById(r.authorId)?.name)} · ${fmtDate(r.createdAt)}</div></td><td>${esc(userById(r.specId)?.name)}</td>
        <td><button class="btn btn-danger btn-sm" data-action="adminDelete" data-type="review" data-id="${r.id}">Удалить</button></td></tr>`).join('')}</tbody></table></div>`;
  } else if (tab === 'reports') {
    const list = db.reports.slice().sort((a, b) => (a.status === 'new' ? -1 : 1) - (b.status === 'new' ? -1 : 1) || b.createdAt - a.createdAt);
    const tLabel = { profile: 'Профиль', order: 'Заказ', message: 'Сообщение', review: 'Отзыв' };
    body = `<div class="panel table-wrap">${list.length ? `<table><thead><tr><th>Жалоба</th><th>Объект</th><th>Статус</th><th></th></tr></thead><tbody>
      ${list.map(r => `<tr><td>${esc(r.reason)}<div class="muted small">${esc(userById(r.authorId)?.name)} · ${fmtDate(r.createdAt)}</div></td><td>${tLabel[r.type]}<div class="small">${reportTarget(r)}</div></td>
        <td>${r.status === 'new' ? '<span class="pill pill-warn">Новая</span>' : '<span class="pill">Решена</span>'}</td>
        <td><div class="flex">${r.status === 'new' ? `<button class="btn btn-ghost btn-sm" data-action="adminResolve" data-id="${r.id}">Закрыть</button>
          <button class="btn btn-danger btn-sm" data-action="adminDelete" data-type="${r.type}" data-id="${r.targetId}" data-report="${r.id}">${r.type === 'profile' ? 'Заблокировать' : 'Удалить контент'}</button>` : ''}</div></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Жалоб нет</div>'}</div>`;
  } else if (tab === 'catalog') {
    body = `<div class="panel"><h3>Категории</h3><p class="hint">Поля: по одному в строке в формате <code>ключ | Название | тип</code>, где тип — text, number, bool или url.</p>
      ${db.categories.map(c => `<form data-form="adminCat" data-id="${c.id}" class="panel" style="margin-bottom:12px">

          <div class="field"><label>Иконка</label><input type="text" name="icon" value="${esc(c.icon)}" maxlength="4"></div></div>
        <div class="field"><label>Жанры (через запятую)</label><input type="text" name="genres" value="${esc(c.genres.join(', '))}"></div>
        <div class="field"><label>Поля профиля</label><textarea name="fields" style="min-height:80px;font-family:monospace;font-size:13px">${esc(c.fields.map(f => `${f.key} | ${f.label} | ${f.type}`).join('\n'))}</textarea></div>
        <button class="btn btn-sm">Сохранить</button></form>`).join('')}
      <form data-form="adminNewCat" class="flex"><input type="text" name="id" required pattern="[a-z]{2,20}" placeholder="slug (латиница)" style="max-width:160px"><input type="text" name="name" required placeholder="Название" style="max-width:220px"><button class="btn btn-sm">+ Категория</button></form></div>
      <div class="panel"><h3>Города</h3><div class="chips" style="margin-bottom:12px">${db.cities.map(c => `<span class="chip">${esc(c.name)} <button class="link-btn" data-action="adminDelCity" data-id="${c.id}" aria-label="Удалить ${esc(c.name)}">×</button></span>`).join('')}</div>
      <form data-form="adminCity" class="flex"><input type="text" name="name" required placeholder="Новый город" style="max-width:260px"><button class="btn btn-sm">Добавить</button></form></div>`;
  }
  const tabs = [['stats', 'Статистика'], ['users', 'Пользователи'], ['orders', 'Заказы'], ['reviews', 'Отзывы'], ['reports', `Жалобы${db.reports.filter(r => r.status === 'new').length ? ' (' + db.reports.filter(r => r.status === 'new').length + ')' : ''}`], ['catalog', 'Категории и города']];
  return `<div class="wrap" style="padding-top:24px"><h1>Админ-панель</h1>
    <nav class="tabs">${tabs.map(([k, l]) => `<a href="#/admin?tab=${k}" class="${tab === k ? 'on' : ''}">${l}</a>`).join('')}</nav>${body}</div>`;
}
function reportTarget(r) {
  if (r.type === 'profile') { const p = profOf(r.targetId); const x = userById(r.targetId); return x ? (p ? `<a href="#/u/${esc(p.username)}">${esc(x.name)}</a>` : esc(x.name)) : 'удалён'; }
  if (r.type === 'order') { const o = orderById(r.targetId); return o ? `<a href="#/orders/${o.id}">${esc(o.title)}</a>` : 'удалён'; }
  if (r.type === 'message') { const m = db.messages.find(x => x.id === r.targetId); return m ? `«${esc((m.text || '📎').slice(0, 80))}» — ${esc(userById(m.from)?.name)}` : 'удалено'; }
  if (r.type === 'review') { const v = db.reviews.find(x => x.id === r.targetId); return v ? `«${esc(v.text.slice(0, 80))}»` : 'удалён'; }
  return '';
}

/* ---------- маршрутизация ---------- */
function parseHash() {
  const h = location.hash.slice(1) || '/';
  const [path, qs] = h.split('?');
  return { path: path || '/', q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
const routes = [
  [/^\/$/, pageHome], [/^\/specialists(?:\/([\w-]+))?$/, pageCatalog], [/^\/u\/([\w.]+)$/, pageProfile],
  [/^\/orders$/, pageOrders], [/^\/orders\/new$/, pageNewOrder], [/^\/orders\/([\w-]+)$/, pageOrder],
  [/^\/messages(?:\/([\w-]+))?$/, pageMessages], [/^\/dashboard$/, pageDashboard], [/^\/settings$/, pageSettings],
  [/^\/admin$/, pageAdmin], [/^\/login$/, pageLogin], [/^\/register$/, pageRegister], [/^\/onboarding$/, pageOnboarding],
  [/^\/terms$/, pageTerms], [/^\/privacy$/, pagePrivacy]
];
let lastPath = null;
// Сохраняем введённое в форме профиля, когда смена категории перерисовывает страницу
let pendingForm = null;
function restoreForm() {
  const f = $(`form[data-form=${pendingForm.form}]`), data = pendingForm.data;
  pendingForm = null;
  if (!f) return;
  f.querySelectorAll('input, textarea, select').forEach(el => {
    if (!el.name || el.name.startsWith('attr_') || el.name === 'genres' || el.name === 'mainCat') return;
    if (el.type === 'checkbox') el.checked = data.some(([k, v]) => k === el.name && v === el.value);
    else { const hit = data.find(([k]) => k === el.name); if (hit) el.value = hit[1]; }
  });
}
function render(keepScroll) {
  const { path, q } = parseHash();
  let html = notFound();
  for (const [re, fn] of routes) { const m = path.match(re); if (m) { html = fn(q, ...m.slice(1).map(x => x && decodeURIComponent(x))); break; } }
  renderHeader();
  $('#app').innerHTML = html;
  const msgs = $('#msgs'); if (msgs) msgs.scrollTop = msgs.scrollHeight;
  if (pendingForm) restoreForm();
  if (!keepScroll && path !== lastPath) window.scrollTo(0, 0);
  lastPath = path;
}
const go = h => { if (location.hash === h) render(true); else location.hash = h; };

/* ---------- действия ---------- */
function requireUser() { const u = me(); if (!u) { go('#/login?next=' + encodeURIComponent(location.hash.slice(1))); return null; } return u; }
function openChat(otherId, orderId) {
  const u = requireUser(); if (!u) return;
  if (otherId === u.id) return toast('Это ваш профиль');
  let c = db.conversations.find(x => x.members.includes(u.id) && x.members.includes(otherId));
  if (!c) { c = { id: uid(), members: [u.id, otherId], orderId: orderId || null, createdAt: now(), lastAt: now() }; db.conversations.push(c); save(); }
  else if (orderId && !c.orderId) { c.orderId = orderId; save(); }
  go('#/messages/' + c.id);
}
function queryFromForm(f) {
  const p = new URLSearchParams();
  for (const [k, v] of new FormData(f)) if (v !== '' && k !== 'cat') p.set(k, v === 'on' ? '1' : v);
  return p.toString();
}

  specialist(f) {

  async order(f, submitter) {

    save(); toast('Спасибо за отзыв!'); render(true);
  },
  reply(f) { const r = db.reviews.find(x => x.id === f.dataset.id); if (r.reply || r.specId !== me().id) return; r.reply = f.reply.value.trim(); save(); toast('Ответ опубликован'); render(true); },
  async message(f) {
    const u = me(), c = db.conversations.find(x => x.id === f.dataset.id);
    const text = f.text.value.trim(), file = f.file.files[0];
    if (!text && !file) return;
    const lastMine = db.messages.filter(m => m.from === u.id).at(-1);
    if (lastMine && now() - lastMine.createdAt < 700) return toast('Слишком часто, подождите секунду', true);
    let att = null;
    try { if (file) att = { name: file.name, type: file.type || 'application/octet-stream', data: file.type.startsWith('image/') ? await readImage(file, 1200) : await readFile(file, 2) }; }
    catch (e) { return toast(e.message, true); }
    db.messages.push({ id: uid(), convId: c.id, from: u.id, text, att, readAt: null, createdAt: now() });
    c.lastAt = now();
    const other = c.members.find(x => x !== u.id);
    if (!db.notifications.some(n => n.userId === other && n.type === 'message' && !n.readAt && n.link === '#/messages/' + c.id))
      notify(other, 'message', `Новое сообщение от ${u.name}`, '#/messages/' + c.id);
    save(); render(true); $('form[data-form=message] textarea')?.focus();
  },
  invite(f) {
    const u = me(), o = orderById(f.order.value), spec = userById(f.dataset.id);
    if (!o.invited.includes(spec.id)) { o.invited.push(spec.id); notify(spec.id, 'invite', `${u.name} приглашает вас к заказу «${o.title}»`, '#/orders/' + o.id); save(); }
    closeModal(); toast('Приглашение отправлено');
  },
  report(f) {
    db.reports.push({ id: uid(), authorId: me().id, type: f.dataset.type, targetId: f.dataset.id, reason: f.reason.value + (f.comment.value.trim() ? ': ' + f.comment.value.trim() : ''), status: 'new', createdAt: now() });
    save(); closeModal(); toast('Жалоба отправлена модераторам');
  },
  adminCat(f) {
    const c = catById(f.dataset.id);
    const fields = f.fields.value.split('\n').map(l => l.split('|').map(s => s.trim())).filter(a => a[0] && a[1])
      .map(([key, label, type]) => ({ key: key.replace(/\W/g, ''), label, type: ['text', 'number', 'bool', 'url'].includes(type) ? type : 'text' }));
    Object.assign(c, { name: f.name.value.trim(), plural: f.plural.value.trim(), icon: f.icon.value.trim() || '•', genres: f.genres.value.split(',').map(s => s.trim()).filter(Boolean), fields });
    save(); toast('Категория сохранена'); render(true);
  },
  adminNewCat(f) {
    if (catById(f.id.value)) return toast('Такой slug уже есть', true);
    db.categories.push({ id: f.id.value, name: f.name.value.trim(), plural: f.name.value.trim(), icon: '•', genres: [], fields: [] }); save(); render(true);
  },
  adminCity(f) { db.cities.push({ id: uid(), name: f.name.value.trim() }); save(); render(true); }
};

/* ---------- события ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!e.target.closest('.menu')) document.querySelectorAll('details.menu[open]').forEach(d => d.removeAttribute('open'));
  if (e.target.closest('.nav a')) $('#nav')?.classList.remove('open');
  if (!el || !actions[el.dataset.action]) return;
  if (el.dataset.action === 'closeModal') {
    if (e.target.closest('.dialog') && !e.target.closest('[data-close]')) return;
    if (!e.target.closest('a[href]')) e.preventDefault();
    closeModal(); return;
  }
  e.preventDefault();
  actions[el.dataset.action]({ ...el.dataset }, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.matches('figure[data-action]')) e.target.click();
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches('.composer textarea')) { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener('submit', e => {
  const f = e.target, h = forms[f.dataset.form];
  if (!h) return;
  e.preventDefault();
  const btn = e.submitter; if (btn) btn.disabled = true;
  Promise.resolve(h(f, btn)).catch(err => toast(err.message || 'Ошибка', true)).finally(() => { if (btn && document.contains(btn)) btn.disabled = false; });
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-action-change=sort]')) { const { path, q } = parseHash(); q.sort = t.value; delete q.page; go('#' + path + '?' + new URLSearchParams(q)); return; }
  if (t.matches('[data-action-change=specCat]')) { pendingForm = { form: 'specialist', data: [...new FormData(t.form)] }; go('#/settings?tab=specialist&cat=' + t.value); return; }
  if (t.type === 'file' && t.closest('.composer') && t.files[0]) toast('Прикреплён файл: ' + t.files[0].name);
  const f = t.form;
  if (f?.hasAttribute('data-auto') && t.type !== 'search' && t.type !== 'number' && t.type !== 'text') f.requestSubmit();
});
window.addEventListener('hashchange', () => { closeModal(); render(); });
// Синхронизация между вкладками (например, чат в двух окнах под разными аккаунтами)
window.addEventListener('storage', e => {
  if (e.key !== DB_KEY && e.key !== SES_KEY) return;
  db = load();
  const a = document.activeElement;
  if (a && a.matches('input, textarea, select') && a.value) { renderHeader(); return; }
  render(true);
});

db = load();
render();
</script>
</body>
